<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESTRICTED ACCESS • VAULT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: #000;
      color: #00ff00;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Matrix-style background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.03) 0px, transparent 1px, transparent 2px, rgba(0, 255, 0, 0.03) 3px),
        repeating-linear-gradient(90deg, rgba(0, 255, 0, 0.03) 0px, transparent 1px, transparent 2px, rgba(0, 255, 0, 0.03) 3px);
      background-size: 20px 20px;
      animation: scanlines 8s linear infinite;
      pointer-events: none;
    }

    @keyframes scanlines {
      0% { background-position: 0 0; }
      100% { background-position: 0 20px; }
    }

    /* Glitch effect overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(0,255,0,0.02) 0%, transparent 50%, rgba(0,255,0,0.02) 100%);
      animation: glitchScan 2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glitchScan {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.3; }
    }

    .container {
      max-width: 600px;
      width: 90%;
      position: relative;
      z-index: 1;
    }

    .security-frame {
      border: 2px solid #00ff00;
      padding: 3rem 2.5rem;
      background: rgba(0, 0, 0, 0.9);
      box-shadow: 
        0 0 50px rgba(0, 255, 0, 0.3),
        inset 0 0 50px rgba(0, 255, 0, 0.05);
      position: relative;
      animation: frameFlicker 0.1s infinite;
    }

    @keyframes frameFlicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.98; }
    }

    .security-frame::before,
    .security-frame::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid #00ff00;
    }

    .security-frame::before {
      top: -2px;
      left: -2px;
      border-right: none;
      border-bottom: none;
    }

    .security-frame::after {
      bottom: -2px;
      right: -2px;
      border-left: none;
      border-top: none;
    }

    .corner-tl,
    .corner-tr {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid #00ff00;
    }

    .corner-tl {
      top: -2px;
      right: -2px;
      border-left: none;
      border-bottom: none;
    }

    .corner-tr {
      bottom: -2px;
      left: -2px;
      border-right: none;
      border-top: none;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .status-indicator {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: rgba(255, 0, 0, 0.2);
      border: 1px solid #ff0000;
      color: #ff0000;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
      animation: statusBlink 1s infinite;
    }

    @keyframes statusBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.6; }
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #00ff00;
      text-shadow: 
        0 0 10px #00ff00,
        0 0 20px #00ff00,
        0 0 30px #00ff00;
      margin-bottom: 0.5rem;
      animation: titleGlow 2s ease-in-out infinite;
    }

    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00; }
      50% { text-shadow: 0 0 20px #00ff00, 0 0 30px #00ff00, 0 0 40px #00ff00; }
    }

    .subtitle {
      font-size: 0.9rem;
      color: #00cc00;
      letter-spacing: 0.15em;
      margin-bottom: 2rem;
    }

    .auth-info {
      background: rgba(0, 255, 0, 0.05);
      border-left: 3px solid #00ff00;
      padding: 1rem;
      margin-bottom: 2rem;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .auth-info::before {
      content: '⚠ SECURITY NOTICE';
      display: block;
      color: #ffff00;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      color: #00cc00;
    }

    input[type="password"] {
      width: 100%;
      background: rgba(0, 255, 0, 0.05);
      border: 2px solid #00ff00;
      color: #00ff00;
      padding: 1rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.1rem;
      letter-spacing: 0.2em;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="password"]:focus {
      background: rgba(0, 255, 0, 0.1);
      box-shadow: 
        0 0 20px rgba(0, 255, 0, 0.3),
        inset 0 0 20px rgba(0, 255, 0, 0.1);
    }

    input[type="password"]::placeholder {
      color: rgba(0, 255, 0, 0.3);
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    button {
      flex: 1;
      background: transparent;
      border: 2px solid #00ff00;
      color: #00ff00;
      padding: 1rem 2rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      cursor: pointer;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(0, 255, 0, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
    }

    button:hover::before {
      width: 300px;
      height: 300px;
    }

    button:hover {
      background: rgba(0, 255, 0, 0.1);
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
    }

    button span {
      position: relative;
      z-index: 1;
    }

    #error {
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid #ff0000;
      color: #ff0000;
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      display: none;
      animation: errorPulse 0.5s ease;
    }

    #error.show {
      display: block;
    }

    @keyframes errorPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .encryption-status {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(0, 255, 0, 0.05);
      border: 1px solid rgba(0, 255, 0, 0.3);
      font-size: 0.75rem;
      text-align: center;
      color: #00cc00;
    }

    .encryption-status::before {
      content: '🔒 ';
    }

    /* Loading animation */
    .loading {
      display: none;
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #ffff00;
    }

    .loading.show {
      display: block;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.3; }
    }

    @media (max-width: 768px) {
      .security-frame {
        padding: 2rem 1.5rem;
      }

      h1 {
        font-size: 1.8rem;
      }

      .btn-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="security-frame">
      <div class="corner-tl"></div>
      <div class="corner-tr"></div>
      
      <div class="header">
        <div class="status-indicator">● UNAUTHORIZED ACCESS RESTRICTED</div>
        <h1>VAULT</h1>
        <p class="subtitle">CLASSIFIED SYSTEM</p>
      </div>

      <div class="auth-info">
        This is a restricted access area. Unauthorized access attempts are logged and monitored. 
        Authentication required to proceed.
      </div>

      <div class="input-group">
        <label for="password">◆ AUTHENTICATION KEY</label>
        <input 
          type="password" 
          id="password" 
          placeholder="ENTER PASSPHRASE"
          autocomplete="off"
          onkeypress="if(event.key === 'Enter') authenticate()"
        />
      </div>

      <div class="btn-group">
        <button onclick="authenticate()">
          <span>→ AUTHENTICATE</span>
        </button>
        <button onclick="window.location.href='../index.html'">
          <span>← RETURN</span>
        </button>
      </div>

      <div id="loading" class="loading">
        &gt;&gt; VERIFYING CREDENTIALS...
      </div>

      <div id="error"></div>

      <div class="encryption-status">
        AES-256 ENCRYPTED • SESSION TIMEOUT: 30 MIN
      </div>
    </div>
  </div>

  <script>
    // Security configuration
    const CONFIG = {
      PASSWORD: "robo2026", // Change this to your secure password
      SESSION_TIMEOUT: 30 * 60 * 1000, // 30 minutes in milliseconds
      MAX_ATTEMPTS: 5,
      LOCKOUT_TIME: 5 * 60 * 1000 // 5 minutes lockout after max attempts
    };

    // Simple encryption for session storage (base64 encoding for basic obfuscation)
    function encrypt(text) {
      return btoa(text + '|' + Date.now());
    }

    function decrypt(encrypted) {
      try {
        const decoded = atob(encrypted);
        const [text, timestamp] = decoded.split('|');
        return { text, timestamp: parseInt(timestamp) };
      } catch {
        return null;
      }
    }

    // Check if user is locked out
    function checkLockout() {
      const lockoutData = localStorage.getItem('vault_lockout');
      if (lockoutData) {
        const lockout = JSON.parse(lockoutData);
        const timeRemaining = lockout.until - Date.now();
        
        if (timeRemaining > 0) {
          const minutes = Math.ceil(timeRemaining / 60000);
          showError(`SYSTEM LOCKED. Too many failed attempts. Try again in ${minutes} minute(s).`);
          document.getElementById('password').disabled = true;
          return true;
        } else {
          localStorage.removeItem('vault_lockout');
          localStorage.removeItem('vault_attempts');
        }
      }
      return false;
    }

    // Track failed attempts
    function trackFailedAttempt() {
      let attempts = parseInt(localStorage.getItem('vault_attempts') || '0');
      attempts++;
      localStorage.setItem('vault_attempts', attempts.toString());
      
      if (attempts >= CONFIG.MAX_ATTEMPTS) {
        const lockoutUntil = Date.now() + CONFIG.LOCKOUT_TIME;
        localStorage.setItem('vault_lockout', JSON.stringify({ until: lockoutUntil }));
        showError(`SECURITY BREACH DETECTED! System locked for 5 minutes.`);
        document.getElementById('password').disabled = true;
        
        // Auto-reload after lockout expires
        setTimeout(() => {
          location.reload();
        }, CONFIG.LOCKOUT_TIME);
      } else {
        const remaining = CONFIG.MAX_ATTEMPTS - attempts;
        showError(`ACCESS DENIED! ${remaining} attempt(s) remaining before lockout.`);
      }
    }

    // Show error message
    function showError(message) {
      const errorEl = document.getElementById('error');
      errorEl.textContent = message;
      errorEl.classList.add('show');
      
      // Play error sound effect (optional, visual feedback only)
      setTimeout(() => {
        errorEl.classList.remove('show');
      }, 5000);
    }

    // Show loading state
    function showLoading(show) {
      const loadingEl = document.getElementById('loading');
      if (show) {
        loadingEl.classList.add('show');
      } else {
        loadingEl.classList.remove('show');
      }
    }

    // Simulate encryption verification delay (adds to security feel)
    function simulateEncryption() {
      return new Promise(resolve => {
        setTimeout(resolve, 800 + Math.random() * 400);
      });
    }

    // Main authentication function
    async function authenticate() {
      // Check if locked out
      if (checkLockout()) {
        return;
      }

      const input = document.getElementById("password").value;
      
      if (!input) {
        showError("AUTHENTICATION KEY REQUIRED");
        return;
      }

      // Show loading state
      showLoading(true);
      
      // Simulate encryption/decryption process
      await simulateEncryption();
      
      if (input === CONFIG.PASSWORD) {
        // Create encrypted session token
        const sessionToken = encrypt('authenticated');
        const sessionExpiry = Date.now() + CONFIG.SESSION_TIMEOUT;
        
        // Store session data
        sessionStorage.setItem('vault_session', sessionToken);
        sessionStorage.setItem('vault_expiry', sessionExpiry.toString());
        
        // Log access (timestamp)
        const accessLog = JSON.parse(localStorage.getItem('vault_access_log') || '[]');
        accessLog.push({
          timestamp: new Date().toISOString(),
          ip: 'hidden', // GitHub Pages doesn't have server-side access
          status: 'success'
        });
        // Keep only last 10 entries
        if (accessLog.length > 10) accessLog.shift();
        localStorage.setItem('vault_access_log', JSON.stringify(accessLog));
        
        // Clear failed attempts
        localStorage.removeItem('vault_attempts');
        
        // Redirect to vault
        showLoading(false);
        window.location.href = "./vault.html";
      } else {
        showLoading(false);
        trackFailedAttempt();
        
        // Log failed attempt
        const accessLog = JSON.parse(localStorage.getItem('vault_access_log') || '[]');
        accessLog.push({
          timestamp: new Date().toISOString(),
          ip: 'hidden',
          status: 'failed'
        });
        if (accessLog.length > 10) accessLog.shift();
        localStorage.setItem('vault_access_log', JSON.stringify(accessLog));
        
        // Clear password field
        document.getElementById('password').value = '';
      }
    }

    // Check for lockout on page load
    window.addEventListener('DOMContentLoaded', () => {
      checkLockout();
      
      // Auto-focus password field
      document.getElementById('password').focus();
    });
  </script>
</body>
</html>
