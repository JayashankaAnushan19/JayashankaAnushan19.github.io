<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLASSIFIED FILE SYSTEM</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Share Tech Mono', monospace;
      background: #000;
      color: #00ff00;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.02) 0px, transparent 1px, transparent 2px, rgba(0, 255, 0, 0.02) 3px),
        repeating-linear-gradient(90deg, rgba(0, 255, 0, 0.02) 0px, transparent 1px, transparent 2px, rgba(0, 255, 0, 0.02) 3px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 0;
    }

    .security-header {
      background: rgba(0, 0, 0, 0.95);
      border-bottom: 2px solid #00ff00;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
    }

    .header-left { display: flex; align-items: center; gap: 1.5rem; }
    
    .vault-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-shadow: 0 0 10px #00ff00;
    }

    .security-badge {
      background: rgba(0, 255, 0, 0.1);
      border: 1px solid #00ff00;
      padding: 0.4rem 0.8rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      animation: badgePulse 2s infinite;
    }

    @keyframes badgePulse {
      0%, 100% { box-shadow: 0 0 5px rgba(0, 255, 0, 0.3); }
      50% { box-shadow: 0 0 15px rgba(0, 255, 0, 0.6); }
    }

    .header-right { display: flex; gap: 1rem; align-items: center; }
    .session-timer { font-size: 0.8rem; color: #ffff00; }
    
    .btn-logout {
      background: transparent;
      border: 1px solid #ff0000;
      color: #ff0000;
      padding: 0.5rem 1rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      background: rgba(255, 0, 0, 0.2);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
    }

    .container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 2rem;
      position: relative;
      z-index: 1;
    }

    .breadcrumb {
      background: rgba(0, 255, 0, 0.05);
      border: 1px solid rgba(0, 255, 0, 0.3);
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .breadcrumb a {
      color: #00ff00;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .breadcrumb a:hover {
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding: 1rem 1.5rem;
      background: rgba(0, 255, 0, 0.03);
      border: 1px solid rgba(0, 255, 0, 0.2);
    }

    .toolbar-left { display: flex; gap: 2rem; align-items: center; }

    .system-status {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.85rem;
      color: #00ff00;
      letter-spacing: 0.1em;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #00ff00;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 10px #00ff00; }
      50% { opacity: 0.5; box-shadow: 0 0 5px #00ff00; }
    }

    .file-count {
      font-size: 0.85rem;
      color: #00cc00;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      background: transparent;
      border: 2px solid #00ff00;
      color: #00ff00;
      padding: 0.75rem 1.5rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: rgba(0, 255, 0, 0.1);
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
      transform: translateY(-2px);
    }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 3rem;
    }

    .file-item, .folder-item {
      background: transparent;
      border: none;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      min-height: 110px;
      border-radius: 4px;
    }

    .folder-item { background: rgba(0, 255, 0, 0.02); }

    .file-item:hover, .folder-item:hover {
      background: rgba(0, 255, 0, 0.1);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 25px rgba(0, 255, 0, 0.2);
    }

    .file-icon, .folder-icon {
      font-size: 2.5rem;
      filter: drop-shadow(0 0 8px rgba(0, 255, 0, 0.5));
      transition: all 0.3s ease;
    }

    .file-item:hover .file-icon, .folder-item:hover .folder-icon {
      filter: drop-shadow(0 0 15px rgba(0, 255, 0, 0.8));
      transform: scale(1.1);
    }

    .folder-icon { font-size: 2.8rem; }

    .file-name, .folder-name {
      text-align: center;
      font-size: 0.8rem;
      word-break: break-word;
      color: #00ff00;
      max-width: 100%;
      line-height: 1.3;
    }

    .file-meta {
      font-size: 0.65rem;
      color: #00cc00;
      opacity: 0.7;
      text-align: center;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.97);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    .modal.show { display: flex; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: rgba(0, 0, 0, 0.98);
      border: 2px solid #00ff00;
      max-width: 90%;
      max-height: 90%;
      padding: 2rem;
      box-shadow: 0 0 50px rgba(0, 255, 0, 0.5);
      overflow: auto;
      animation: modalSlideIn 0.4s ease;
    }

    @keyframes modalSlideIn {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(0, 255, 0, 0.3);
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: #00ff00;
      text-shadow: 0 0 10px #00ff00;
    }

    .modal-close {
      background: transparent;
      border: 1px solid #ff0000;
      color: #ff0000;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      transition: all 0.3s ease;
    }

    .modal-close:hover {
      background: rgba(255, 0, 0, 0.2);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background: rgba(0, 255, 0, 0.1);
      border: 2px solid #00ff00;
      color: #00ff00;
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .copy-btn:hover {
      background: rgba(0, 255, 0, 0.2);
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.6);
      transform: translateY(-2px);
    }

    .copy-success {
      display: inline-block;
      margin-left: 1rem;
      color: #00ff00;
      font-size: 0.85rem;
      opacity: 0;
      animation: fadeInOut 2s ease;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0; }
      10%, 90% { opacity: 1; }
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #00cc00;
      font-size: 0.9rem;
    }

    .empty-state-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }

    .access-log {
      margin-top: 3rem;
      padding: 2rem;
      background: rgba(0, 255, 0, 0.03);
      border: 1px solid rgba(0, 255, 0, 0.2);
    }

    .access-log h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      margin-bottom: 1rem;
      color: #ffff00;
    }

    .log-entry {
      font-size: 0.75rem;
      padding: 0.5rem;
      border-bottom: 1px solid rgba(0, 255, 0, 0.1);
      display: flex;
      justify-content: space-between;
    }

    .log-success { color: #00ff00; }
    .log-failed { color: #ff0000; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="security-header">
    <div class="header-left">
      <div class="vault-title">◆ CLASSIFIED</div>
      <div class="security-badge">🔒 SECURE SESSION</div>
    </div>
    <div class="header-right">
      <div class="session-timer">SESSION: <span id="timeRemaining">30:00</span></div>
      <button class="btn-logout" onclick="logout()">→ LOGOUT</button>
    </div>
  </div>

  <div class="container">
    <div class="breadcrumb">
      <span>📁</span>
      <a href="#" onclick="navigateToRoot()">DATA</a>
      <span id="currentPath"></span>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="system-status">
          <span class="status-dot"></span>
          <span>SYSTEM ACTIVE</span>
        </div>
        <div class="file-count">
          <span>📊</span> <span id="itemCount">Loading...</span>
        </div>
      </div>
      <div>
        <button class="btn" onclick="refreshFiles()">
          <span>⟳</span> REFRESH
        </button>
      </div>
    </div>

    <div class="file-grid" id="fileGrid"></div>

    <div class="access-log">
      <h3>⚠ ACCESS LOG</h3>
      <div id="accessLog"></div>
    </div>
  </div>

  <div class="modal" id="mediaModal">
    <div class="modal-content" style="max-width: 1200px;">
      <div class="modal-header">
        <div class="modal-title" id="mediaTitle">FILE VIEWER</div>
        <button class="modal-close" onclick="closeModal('mediaModal')">✕ CLOSE</button>
      </div>
      <div class="modal-body" id="mediaBody"></div>
    </div>
  </div>

  <script>
const CONFIG = {
  SESSION_TIMEOUT: 30 * 60 * 1000,
  GITHUB_USER: 'JayashankaAnushan19',
  GITHUB_REPO: 'JayashankaAnushan19.github.io',
  DATA_PATH: 'private/data'
};

let currentPath = [];
let fileStructure = null;

function checkSession() {
  const token = sessionStorage.getItem('vault_session');
  const expiry = sessionStorage.getItem('vault_expiry');
  if (!token || !expiry) {
    window.location.href = './index.html';
    return false;
  }
  if (Date.now() >= parseInt(expiry)) {
    alert('⚠ SESSION EXPIRED\n\nAuthenticate again.');
    logout();
    return false;
  }
  return true;
}

function updateSessionTimer() {
  const expiry = sessionStorage.getItem('vault_expiry');
  if (!expiry) return;
  const remaining = Math.max(0, parseInt(expiry) - Date.now());
  const min = Math.floor(remaining / 60000);
  const sec = Math.floor((remaining % 60000) / 1000);
  document.getElementById('timeRemaining').textContent = 
    `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  if (remaining <= 0) logout();
}

function logout() {
  sessionStorage.clear();
  window.location.href = './index.html';
}

async function fetchGitHubContents(path = '') {
  const url = `https://api.github.com/repos/${CONFIG.GITHUB_USER}/${CONFIG.GITHUB_REPO}/contents/${CONFIG.DATA_PATH}${path ? '/' + path : ''}`;
  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    console.error('Fetch error:', e);
    return null;
  }
}

async function loadFileStructure() {
  const contents = await fetchGitHubContents(currentPath.join('/'));
  if (!contents) {
    fileStructure = {folders: {}, files: [], error: true};
    return;
  }
  const folders = {}, files = [];
  for (const item of contents) {
    if (item.type === 'dir') {
      folders[item.name] = {name: item.name, path: item.path};
    } else if (item.type === 'file' && item.name !== '.gitkeep') {
      files.push({
        name: item.name,
        type: item.name.split('.').pop().toLowerCase(),
        size: (item.size < 1024 ? item.size + ' B' : item.size < 1048576 ? (item.size / 1024).toFixed(1) + ' KB' : (item.size / 1048576).toFixed(1) + ' MB'),
        downloadUrl: item.download_url
      });
    }
  }
  fileStructure = {folders, files};
}

async function renderFiles() {
  const grid = document.getElementById('fileGrid');
  grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ffff00; padding: 2rem;">⟳ LOADING...</div>';
  
  await loadFileStructure();
  grid.innerHTML = '';
  updateBreadcrumb();
  
  if (fileStructure.error) {
    grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><div class="empty-state-icon">⚠️</div><h3 style="color: #ffff00;">DATA FOLDER NOT FOUND</h3><p>Create: <code style="background: rgba(0,255,0,0.1); padding: 0.2rem 0.5rem;">${CONFIG.DATA_PATH}</code> in your repository</p></div>`;
    document.getElementById('itemCount').textContent = '0 FOLDERS • 0 FILES';
    return;
  }
  
  const folders = Object.entries(fileStructure.folders);
  const files = fileStructure.files;
  
  if (!folders.length && !files.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><div class="empty-state-icon">📂</div><p>NO FILES</p></div>`;
    document.getElementById('itemCount').textContent = '0 FOLDERS • 0 FILES';
    return;
  }
  
  folders.forEach(([name], i) => {
    const el = document.createElement('div');
    el.className = 'folder-item';
    el.innerHTML = `<div class="folder-icon">📁</div><div class="folder-name">${name}</div><div class="file-meta">FOLDER</div>`;
    el.onclick = () => navigateToFolder(name);
    el.style.animation = `fadeInUp 0.4s ease ${i * 0.05}s backwards`;
    grid.appendChild(el);
  });
  
  files.forEach((file, i) => {
    const el = document.createElement('div');
    el.className = 'file-item';
    const icons = {pdf:'📄',doc:'📝',docx:'📝',txt:'📃',mp4:'🎬',webm:'🎬',mp3:'🎵',wav:'🎵',jpg:'🖼️',png:'🖼️',gif:'🖼️'};
    el.innerHTML = `<div class="file-icon">${icons[file.type] || '📎'}</div><div class="file-name">${file.name}</div><div class="file-meta">${file.size}</div>`;
    el.onclick = () => openFile(file);
    el.style.animation = `fadeInUp 0.4s ease ${(folders.length + i) * 0.05}s backwards`;
    grid.appendChild(el);
  });
  
  document.getElementById('itemCount').textContent = `${folders.length} FOLDERS • ${files.length} FILES`;
}

function updateBreadcrumb() {
  const el = document.getElementById('currentPath');
  el.innerHTML = currentPath.length ? currentPath.map((p, i) => 
    `<span> / </span><a href="#" onclick="navigateToIndex(${i}); return false;">${p}</a>`
  ).join('') : '';
}

function navigateToRoot() { currentPath = []; renderFiles(); }
function navigateToFolder(name) { currentPath.push(name); renderFiles(); }
function navigateToIndex(i) { currentPath = currentPath.slice(0, i + 1); renderFiles(); }
function refreshFiles() { renderFiles(); }

async function openFile(file) {
  const modal = document.getElementById('mediaModal');
  const title = document.getElementById('mediaTitle');
  const body = document.getElementById('mediaBody');
  
  title.textContent = `🔒 ${file.name}`;
  body.innerHTML = '<div style="text-align: center; padding: 3rem; color: #ffff00;">⟳ LOADING...</div>';
  modal.classList.add('show');
  
  try {
    if (['mp4','webm'].includes(file.type)) {
      body.innerHTML = `<video controls style="width:100%; max-height:70vh;"><source src="${file.downloadUrl}"></video><button class="copy-btn" onclick="copyUrl('${file.downloadUrl}')">📋 COPY URL</button>`;
    } else if (['mp3','wav'].includes(file.type)) {
      body.innerHTML = `<audio controls style="width:100%;"><source src="${file.downloadUrl}"></audio><button class="copy-btn" onclick="copyUrl('${file.downloadUrl}')">📋 COPY URL</button>`;
    } else if (['jpg','png','gif'].includes(file.type)) {
      body.innerHTML = `<img src="${file.downloadUrl}" style="max-width:100%; height:auto;"><br><button class="copy-btn" onclick="copyUrl('${file.downloadUrl}')">📋 COPY URL</button>`;
    } else if (file.type === 'pdf') {
      body.innerHTML = `<iframe src="${file.downloadUrl}" style="width:100%; height:70vh; border:1px solid rgba(0,255,0,0.3);"></iframe><button class="copy-btn" onclick="copyUrl('${file.downloadUrl}')">📋 COPY URL</button><a href="${file.downloadUrl}" download class="copy-btn" style="margin-left:1rem;">⬇ DOWNLOAD</a>`;
    } else if (file.type === 'txt') {
      const res = await fetch(file.downloadUrl);
      const text = await res.text();
      body.innerHTML = `<pre id="txt" style="background:rgba(0,255,0,0.05); padding:1.5rem; border:1px solid rgba(0,255,0,0.3); overflow:auto; max-height:60vh; white-space:pre-wrap;">${text}</pre><button class="copy-btn" onclick="copyText()">📋 COPY CONTENT</button>`;
    } else {
      body.innerHTML = `<div style="text-align:center; padding:2rem;"><h3 style="color:#00ff00;">📎 ${file.name}</h3><p>${file.size}</p><br><a href="${file.downloadUrl}" download class="copy-btn">⬇ DOWNLOAD</a><button class="copy-btn" onclick="copyUrl('${file.downloadUrl}')" style="margin-left:1rem;">📋 COPY URL</button></div>`;
    }
  } catch (e) {
    body.innerHTML = `<div style="text-align:center; padding:2rem; color:#ff0000;"><h3>⚠ ERROR</h3><p>${e.message}</p></div>`;
  }
}

function copyUrl(url) {
  navigator.clipboard.writeText(url).then(() => showSuccess()).catch(() => alert('Copy failed'));
}

function copyText() {
  const text = document.getElementById('txt').textContent;
  navigator.clipboard.writeText(text).then(() => showSuccess()).catch(() => alert('Copy failed'));
}

function showSuccess() {
  const ex = document.querySelector('.copy-success');
  if (ex) ex.remove();
  const s = document.createElement('span');
  s.className = 'copy-success';
  s.textContent = '✓ COPIED';
  document.querySelector('.modal-body').appendChild(s);
}

function closeModal() {
  document.getElementById('mediaModal').classList.remove('show');
  const v = document.querySelector('video');
  const a = document.querySelector('audio');
  if (v) v.pause();
  if (a) a.pause();
}

function loadAccessLog() {
  const el = document.getElementById('accessLog');
  const log = JSON.parse(localStorage.getItem('vault_access_log') || '[]');
  if (!log.length) {
    el.innerHTML = '<div class="log-entry">No logs</div>';
    return;
  }
  el.innerHTML = '';
  log.reverse().slice(0, 10).forEach(e => {
    const div = document.createElement('div');
    div.className = `log-entry log-${e.status}`;
    div.innerHTML = `<span>${new Date(e.timestamp).toLocaleString()}</span><span>${e.status.toUpperCase()}</span>`;
    el.appendChild(div);
  });
}

window.addEventListener('DOMContentLoaded', async () => {
  if (!checkSession()) return;
  await renderFiles();
  loadAccessLog();
  updateSessionTimer();
  setInterval(updateSessionTimer, 1000);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  document.getElementById('mediaModal').addEventListener('click', e => { if (e.target.id === 'mediaModal') closeModal(); });
});
  </script>
</body>
</html>
