<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAULT • FILE SYSTEM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: #000;
      color: #00ff00;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Secure background grid */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.02) 0px, transparent 1px, transparent 2px, rgba(0, 255, 0, 0.02) 3px),
        repeating-linear-gradient(90deg, rgba(0, 255, 0, 0.02) 0px, transparent 1px, transparent 2px, rgba(0, 255, 0, 0.02) 3px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 0;
    }

    /* Security header */
    .security-header {
      background: rgba(0, 0, 0, 0.95);
      border-bottom: 2px solid #00ff00;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .vault-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-shadow: 0 0 10px #00ff00;
    }

    .security-badge {
      background: rgba(0, 255, 0, 0.1);
      border: 1px solid #00ff00;
      padding: 0.4rem 0.8rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      animation: badgePulse 2s infinite;
    }

    @keyframes badgePulse {
      0%, 100% { box-shadow: 0 0 5px rgba(0, 255, 0, 0.3); }
      50% { box-shadow: 0 0 15px rgba(0, 255, 0, 0.6); }
    }

    .header-right {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .session-timer {
      font-size: 0.8rem;
      color: #ffff00;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid #ff0000;
      color: #ff0000;
      padding: 0.5rem 1rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      background: rgba(255, 0, 0, 0.2);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
    }

    /* Main container */
    .container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 2rem;
      position: relative;
      z-index: 1;
    }

    /* Breadcrumb navigation */
    .breadcrumb {
      background: rgba(0, 255, 0, 0.05);
      border: 1px solid rgba(0, 255, 0, 0.3);
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .breadcrumb a {
      color: #00ff00;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .breadcrumb a:hover {
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
    }

    .breadcrumb span {
      color: #00cc00;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .toolbar-left {
      display: flex;
      gap: 1rem;
    }

    .btn {
      background: transparent;
      border: 2px solid #00ff00;
      color: #00ff00;
      padding: 0.75rem 1.5rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      background: rgba(0, 255, 0, 0.1);
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
      transform: translateY(-2px);
    }

    .btn-danger {
      border-color: #ff0000;
      color: #ff0000;
    }

    .btn-danger:hover {
      background: rgba(255, 0, 0, 0.1);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
    }

    /* File grid */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .file-item,
    .folder-item {
      background: rgba(0, 255, 0, 0.05);
      border: 2px solid rgba(0, 255, 0, 0.3);
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      min-height: 150px;
    }

    .folder-item {
      border-color: #00ff00;
    }

    .file-item:hover,
    .folder-item:hover {
      border-color: #00ffff;
      background: rgba(0, 255, 255, 0.1);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
      transform: translateY(-5px);
    }

    .file-icon,
    .folder-icon {
      font-size: 3rem;
      filter: drop-shadow(0 0 10px #00ff00);
    }

    .folder-icon {
      font-size: 3.5rem;
    }

    .file-name,
    .folder-name {
      text-align: center;
      font-size: 0.85rem;
      word-break: break-word;
      color: #00ff00;
    }

    .file-meta {
      font-size: 0.7rem;
      color: #00cc00;
      opacity: 0.7;
    }

    .delete-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: rgba(255, 0, 0, 0.2);
      border: 1px solid #ff0000;
      color: #ff0000;
      width: 25px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: all 0.3s ease;
      font-size: 0.8rem;
    }

    .file-item:hover .delete-btn,
    .folder-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      background: rgba(255, 0, 0, 0.5);
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    .modal.show {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: rgba(0, 0, 0, 0.98);
      border: 2px solid #00ff00;
      max-width: 90%;
      max-height: 90%;
      padding: 2rem;
      position: relative;
      box-shadow: 0 0 50px rgba(0, 255, 0, 0.5);
      overflow: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(0, 255, 0, 0.3);
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: #00ff00;
      text-shadow: 0 0 10px #00ff00;
    }

    .modal-close {
      background: transparent;
      border: 1px solid #ff0000;
      color: #ff0000;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      transition: all 0.3s ease;
    }

    .modal-close:hover {
      background: rgba(255, 0, 0, 0.2);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
    }

    .modal-body {
      color: #00ff00;
    }

    /* Input styles */
    input[type="text"] {
      background: rgba(0, 255, 0, 0.05);
      border: 2px solid #00ff00;
      color: #00ff00;
      padding: 0.75rem 1rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
      width: 300px;
      max-width: 100%;
      outline: none;
    }

    input[type="text"]:focus {
      background: rgba(0, 255, 0, 0.1);
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
    }

    /* Media viewers */
    #videoPlayer,
    #audioPlayer,
    #imageViewer {
      max-width: 100%;
      max-height: 70vh;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
    }

    #pdfViewer,
    #docViewer {
      width: 100%;
      height: 70vh;
      background: rgba(0, 255, 0, 0.05);
      border: 1px solid rgba(0, 255, 0, 0.3);
      color: #00ff00;
      padding: 2rem;
      overflow: auto;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #00cc00;
      font-size: 0.9rem;
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    /* Access log */
    .access-log {
      margin-top: 3rem;
      padding: 2rem;
      background: rgba(0, 255, 0, 0.03);
      border: 1px solid rgba(0, 255, 0, 0.2);
    }

    .access-log h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      margin-bottom: 1rem;
      color: #ffff00;
    }

    .log-entry {
      font-size: 0.75rem;
      padding: 0.5rem;
      border-bottom: 1px solid rgba(0, 255, 0, 0.1);
      display: flex;
      justify-content: space-between;
    }

    .log-success {
      color: #00ff00;
    }

    .log-failed {
      color: #ff0000;
    }

    @media (max-width: 768px) {
      .security-header {
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar-left {
        flex-direction: column;
      }

      .file-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1rem;
      }

      .modal-content {
        padding: 1rem;
        max-width: 95%;
      }

      input[type="text"] {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Security Header -->
  <div class="security-header">
    <div class="header-left">
      <div class="vault-title">◆ VAULT</div>
      <div class="security-badge">🔒 ENCRYPTED SESSION ACTIVE</div>
    </div>
    <div class="header-right">
      <div class="session-timer" id="sessionTimer">SESSION: <span id="timeRemaining">30:00</span></div>
      <button class="btn-logout" onclick="logout()">→ LOGOUT</button>
    </div>
  </div>

  <!-- Main Container -->
  <div class="container">
    <!-- Breadcrumb -->
    <div class="breadcrumb" id="breadcrumb">
      <span>📁</span>
      <a href="#" onclick="navigateToRoot()">ROOT</a>
      <span id="currentPath"></span>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn" onclick="showCreateFolderModal()">
          <span>📁</span> NEW FOLDER
        </button>
        <button class="btn" onclick="uploadFile()">
          <span>📤</span> UPLOAD FILE
        </button>
      </div>
      <div>
        <button class="btn" onclick="refreshFiles()">
          <span>⟳</span> REFRESH
        </button>
      </div>
    </div>

    <!-- File Grid -->
    <div class="file-grid" id="fileGrid">
      <!-- Files and folders will be loaded here -->
    </div>

    <!-- Access Log -->
    <div class="access-log">
      <h3>⚠ ACCESS LOG</h3>
      <div id="accessLog"></div>
    </div>
  </div>

  <!-- Modal for create folder -->
  <div class="modal" id="createFolderModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">CREATE NEW FOLDER</div>
        <button class="modal-close" onclick="closeModal('createFolderModal')">✕ CLOSE</button>
      </div>
      <div class="modal-body">
        <label for="folderName">FOLDER NAME:</label>
        <input type="text" id="folderName" placeholder="Enter folder name" />
        <br><br>
        <button class="btn" onclick="createFolder()">CREATE</button>
      </div>
    </div>
  </div>

  <!-- Modal for media viewing -->
  <div class="modal" id="mediaModal">
    <div class="modal-content" style="max-width: 1200px;">
      <div class="modal-header">
        <div class="modal-title" id="mediaTitle">FILE VIEWER</div>
        <button class="modal-close" onclick="closeModal('mediaModal')">✕ CLOSE</button>
      </div>
      <div class="modal-body" id="mediaBody">
        <!-- Media content will be loaded here -->
      </div>
    </div>
  </div>

  <script src="./vault.js"></script>
</body>
</html>
