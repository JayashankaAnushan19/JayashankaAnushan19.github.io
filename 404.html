<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>!function(){var t=localStorage.getItem('rj-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light')}();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080C14; --panel:#0E1622; --border:#1A2C42; --border-soft:#142236;
    --ink:#DDE4F0; --ink-dim:#7F93AE; --ink-faint:#435872;
    --blue:#5A8FCA; --blue-dim:#2B5A8E; --blue-glow:rgba(90,143,202,0.08);
  }
  [data-theme="light"]{
    --bg:#F0F4FA; --panel:#FFFFFF; --border:#CBD8EC; --border-soft:#D8E4F2;
    --ink:#0D1829; --ink-dim:#3E5470; --ink-faint:#7A95B8;
    --blue:#2B65B0; --blue-dim:#8AADD8; --blue-glow:rgba(43,101,176,0.08);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
    position:relative;
  }

  /* GRID BACKGROUND */
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--border-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
    background-size:48px 48px;
    opacity:0.4;
    pointer-events:none;
  }

  /* GLOW */
  body::after{
    content:'';
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-60%);
    width:600px; height:600px;
    background:radial-gradient(circle, var(--blue-glow) 0%, transparent 65%);
    pointer-events:none;
  }

  .card{
    position:relative; z-index:1;
    text-align:center;
    padding:0 32px;
    max-width:480px;
    width:100%;
  }

  .err-code{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(88px,18vw,148px);
    font-weight:700;
    line-height:1;
    letter-spacing:-0.04em;
    color:transparent;
    -webkit-text-stroke:1.5px var(--border);
    background:linear-gradient(160deg, var(--ink-faint) 0%, var(--blue-dim) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:8px;
    user-select:none;
  }

  .divider{
    width:40px; height:1px;
    background:var(--border);
    margin:24px auto;
  }

  .headline{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(18px,3vw,24px);
    font-weight:600;
    margin-bottom:12px;
    color:var(--ink);
  }

  .sub{
    font-size:12px;
    color:var(--ink-faint);
    letter-spacing:0.06em;
    line-height:1.7;
    margin-bottom:36px;
  }

  .btns{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:13px 22px;
    border-radius:2px;
    border:1px solid var(--border);
    text-decoration:none;
    transition:border-color 0.2s, color 0.2s, background 0.2s;
    white-space:nowrap;
  }
  .btn-primary{
    background:var(--blue); color:#DDE4F0;
    border-color:var(--blue);
  }
  .btn-primary:hover{ background:#6FA3D9; text-decoration:none; }
  .btn-ghost{ color:var(--ink-dim); }
  .btn-ghost:hover{ border-color:var(--blue); color:var(--blue); text-decoration:none; }

  .meta{
    margin-top:48px;
    font-size:10.5px;
    letter-spacing:0.12em;
    color:var(--ink-faint);
    text-transform:uppercase;
  }
  .meta a{ color:var(--ink-faint); text-decoration:none; }
  .meta a:hover{ color:var(--blue); }

  /* THEME TOGGLE */
  .theme-toggle{
    position:fixed; top:20px; right:20px;
    background:none; border:1px solid rgba(127,147,174,0.25);
    border-radius:4px; width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink-faint);
    transition:color 0.15s, border-color 0.15s;
    z-index:10;
  }
  .theme-toggle:hover{ color:var(--ink); border-color:var(--blue); }
  .icon-moon{ display:none; } .icon-sun{ display:block; }
  [data-theme="light"] .icon-moon{ display:block; }
  [data-theme="light"] .icon-sun{ display:none; }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
  <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="card">
  <div class="err-code">404</div>
  <div class="divider"></div>
  <h1 class="headline">Page not found</h1>
  <p class="sub">The page you're looking for doesn't exist<br>or may have been moved.</p>
  <div class="btns">
    <a class="btn btn-primary" href="/">← Back to Portfolio</a>
    <a class="btn btn-ghost" href="/robojain/">Visit RoboJain</a>
  </div>
  <p class="meta">
    <a href="/">Jayashanka Anushan</a>
    &nbsp;·&nbsp;
    <a href="/robojain/">RoboJain</a>
  </p>
</div>

<script>
(function(){
  var btn=document.getElementById('themeToggle');
  if(btn)btn.addEventListener('click',function(){
    var h=document.documentElement,isLight=h.getAttribute('data-theme')==='light';
    isLight?h.removeAttribute('data-theme'):h.setAttribute('data-theme','light');
    localStorage.setItem('rj-theme',isLight?'dark':'light');
  });
})();
</script>
</body>
</html>
