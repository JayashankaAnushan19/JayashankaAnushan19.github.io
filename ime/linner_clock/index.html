<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linner Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#06090f;--panel:rgba(13,20,32,.72);--line:#1c2a3d;--ink:#e8f1fb;--dim:#7b8ea6;--accent:#4de3ff;--accent2:#8b7bff}
html{background:var(--bg)}
body{min-height:100vh;font-family:'Fredoka',sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}

/* soft animated background: three blurred blobs tinted by the current mode */
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:52vmax;height:52vmax;border-radius:50%;filter:blur(90px);opacity:.28;background:var(--accent);transition:background 1.6s}
.blob.b1{top:-18vmax;left:-14vmax;animation:drift1 26s ease-in-out infinite alternate}
.blob.b2{bottom:-22vmax;right:-16vmax;background:var(--accent2);animation:drift2 32s ease-in-out infinite alternate}
.blob.b3{top:30%;left:35%;width:34vmax;height:34vmax;opacity:.14;animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,12vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vmax,-10vmax) scale(1.1)}}
@keyframes drift3{to{transform:translate(-12vmax,14vmax) scale(.85)}}

/* emojis that float up the screen */
.floaters{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.floater{position:absolute;bottom:-3rem;opacity:0;animation:floatUp linear forwards}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.35}88%{opacity:.25}100%{transform:translateY(-115vh) rotate(var(--rot,20deg));opacity:0}}

main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:3.5rem 16px 5rem;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.back{align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.1em;color:var(--dim);text-decoration:none;margin-bottom:2.2rem;transition:color .2s}
.back:hover,.back:focus-visible{color:var(--accent);outline:none}

h1{font-weight:600;font-size:clamp(2.2rem,8vw,3.6rem);letter-spacing:-.01em;line-height:1.05}
h1 span{background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:.7rem;min-height:1.2rem;font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);transition:opacity .4s}
.sub.out{opacity:0}

.clocks{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-top:2.4rem}
.clock{position:relative;padding:1.6rem 1.4rem 1.5rem;border-radius:22px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);overflow:hidden;transition:transform .35s cubic-bezier(.2,.9,.3,1.4)}
.clock:hover{transform:translateY(-4px) rotate(-.6deg)}
.clock.her:hover{transform:translateY(-4px) rotate(.6deg)}
.clock.her{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 50px color-mix(in srgb,var(--accent) 16%,transparent)}
.city{display:flex;align-items:center;gap:.6rem;font-weight:500;font-size:1.2rem}
.flag{display:inline-block;font-size:1.5rem;cursor:pointer;user-select:none;transition:transform .25s}
.flag:hover{transform:rotate(-14deg) scale(1.2)}
.flag.spin{animation:spin .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes spin{to{transform:rotate(360deg) scale(1.3)}}
.zone{margin-top:.15rem;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.time{margin-top:1.3rem;font-weight:600;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.time .sec{font-size:.5em;color:var(--dim);font-weight:500}
.time .ampm{font-size:.32em;letter-spacing:.06em;color:var(--dim);margin-left:.35rem;font-weight:500}
.date{margin-top:.7rem;font-size:.95rem;color:var(--dim)}

.diff{margin-top:1rem;text-align:center;font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.06em;line-height:1.6;color:var(--dim)}

.mode{margin-top:2rem;text-align:center}
.mode .lead{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.emoji{display:inline-block;margin-top:.5rem;font-size:clamp(3.6rem,15vw,5.6rem);line-height:1;background:none;border:0;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 8px 24px color-mix(in srgb,var(--accent) 45%,transparent));transition:filter 1s}
.emoji:focus-visible{outline:2px dashed var(--accent);outline-offset:8px;border-radius:12px}
.emoji:active{transform:scale(.88)}
.emoji.sway{animation:sway 2.6s ease-in-out infinite}
.emoji.bob{animation:bob 3s ease-in-out infinite}
.emoji.bounce{animation:bounce 1.1s cubic-bezier(.3,.9,.4,1) infinite}
.emoji.shrug{animation:shrug 2.4s ease-in-out infinite}
.emoji.wobble{animation:wobble 2.2s ease-in-out infinite}
.emoji.hop{animation:hop 1.4s ease-in-out infinite}
.emoji.pulse{animation:pulse 1.6s ease-in-out infinite}
.emoji.shake{animation:shake 1.8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-9deg) translateX(-6px)}50%{transform:rotate(9deg) translateX(6px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.12,.86)}55%{transform:translateY(-26px) scale(.94,1.08)}}
@keyframes shrug{0%,100%{transform:translateY(0)}35%{transform:translateY(-10px) rotate(-6deg)}70%{transform:translateY(-4px) rotate(6deg)}}
@keyframes wobble{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px) rotate(-8deg)}60%{transform:translateY(0)}80%{transform:translateY(-8px) rotate(6deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
@keyframes shake{0%,70%,100%{transform:translateX(0) rotate(0)}75%{transform:translateX(-8px) rotate(-6deg)}85%{transform:translateX(8px) rotate(6deg)}95%{transform:translateX(-4px)}}

.mode .now{margin-top:.5rem;font-weight:600;font-size:clamp(1.7rem,7vw,2.8rem);line-height:1.15;color:var(--accent);text-shadow:0 0 34px color-mix(in srgb,var(--accent) 50%,transparent);transition:color .8s}
.now.swap,.quip.swap{animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.quip{display:block;margin:.8rem auto 0;max-width:30rem;font:400 1.1rem/1.45 'Fredoka',sans-serif;color:var(--ink);background:none;border:0;cursor:pointer;opacity:.9;-webkit-tap-highlight-color:transparent}
.quip:hover{opacity:1}
.quip:focus-visible{outline:2px dashed var(--accent);outline-offset:4px;border-radius:8px}
.hint{margin-top:.4rem;font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);opacity:.7}
.taps{margin-top:1.2rem;min-height:1.3rem;font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.08em;color:var(--dim)}

/* confetti burst from the emoji */
.bit{position:fixed;z-index:20;pointer-events:none;font-size:1.5rem;animation:burst .95s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1);opacity:0}}

/* "new mode unlocked" toast */
.toast{position:fixed;left:50%;bottom:1.6rem;z-index:30;transform:translate(-50%,30px);opacity:0;padding:.7rem 1.3rem;border-radius:50px;background:var(--panel);border:1px solid var(--accent);color:var(--ink);font-size:.95rem;backdrop-filter:blur(8px);box-shadow:0 10px 40px color-mix(in srgb,var(--accent) 25%,transparent);transition:opacity .4s,transform .5s cubic-bezier(.2,.9,.3,1.4);pointer-events:none;text-align:center;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:620px){
  .clocks{grid-template-columns:1fr}
  .time{font-size:clamp(2.6rem,14vw,3.6rem)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="floaters" id="floaters" aria-hidden="true"></div>

<main>
  <a class="back" href="../">&larr; all projects</a>

  <h1>Linner <span>Clock</span></h1>
  <p class="sub" id="sub">Imethma Standard Time</p>

  <section class="clocks" aria-label="Clocks">
    <article class="clock" id="dubai">
      <div class="city"><span class="flag" aria-hidden="true">🇦🇪</span>Dubai</div>
      <div class="zone">Asia / Dubai</div>
      <div class="time" data-role="time" aria-hidden="true"></div>
      <div class="date" data-role="date"></div>
    </article>
    <article class="clock her" id="preston">
      <div class="city"><span class="flag" aria-hidden="true">🇬🇧</span>Preston</div>
      <div class="zone">Europe / London</div>
      <div class="time" data-role="time" aria-hidden="true"></div>
      <div class="date" data-role="date"></div>
    </article>
  </section>

  <p class="diff" id="diff"></p>

  <section class="mode">
    <p class="lead">Right now she's in</p>
    <button type="button" class="emoji" id="modeEmoji" aria-label="Tap for a surprise">🕐</button>
    <p class="now" id="modeNow" aria-live="polite">…</p>
    <button type="button" class="quip" id="quip" aria-label="Show another line"></button>
    <p class="hint">tap the emoji · tap the line</p>
    <p class="taps" id="taps"></p>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var DUBAI = 'Asia/Dubai', PRESTON = 'Europe/London';
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

  // Her day, in Preston time. `from` = minutes since midnight; a block runs until the next one.
  var WIND = { emoji: '📱', label: 'Winding Down', anim: 'pulse', accent: '#c96bff', asleep: false,
      quips: ['Just one more Instagram short…', 'Scrolling: the official bedtime routine.', 'Bedtime is only a suggestion.', 'One short turned into twenty.'],
      warm:  ['Sleep well when it finally happens. 🌙', 'Sweet dreams, Ime.'],
      mem:   ['Shorts at midnight: a tradition older than sleep.', 'One more short. And another. And another.'] };
  var MODES = [
    { from: 0, mode: WIND },
    { from: 60, mode: { emoji: '💤', label: 'Fast Asleep', anim: 'bob', accent: '#8b7bff', asleep: true,
      quips: ['Shhh. Sleep in progress.', 'Do not disturb. Recharging.', 'Dream loading… 99%.', 'Sleeping late is a lifestyle.'],
      warm:  ['Sleep tight. Everything else can wait.', 'Sweet dreams. Really.'],
      mem:   ['Sleeping late is a lifestyle, not a mistake.', 'The bed is the best place in the world at this hour.'] } },
    { from: 360, mode: { emoji: '🏪', label: 'Early Shop Shift (some days)', anim: 'hop', accent: '#3dffa2', asleep: false,
      quips: ['Up before the sun. Legendary.', 'Early shift: some days only, thankfully.', 'Coffee first, customers later.', 'Sunrise shift energy.'],
      warm:  ['Early starts are hard. Well done. 💗', 'You are already ahead of the day.'],
      mem:   ['Some people meet the sunrise on purpose. Respect.', 'Early shifts build character. And tiredness.'] } },
    { from: 480, mode: { emoji: '😴', label: 'Almost Awake', anim: 'bob', accent: '#7fb2ff', asleep: false,
      quips: ['Loading… please wait.', 'Eyes: 40% open.', 'Not yet. Ask again in an hour.', 'Snooze has entered the chat.'],
      warm:  ['Take your time. No rush.', 'Good morning, whenever it starts.'],
      mem:   ['Nobody has ever said "I love 8am". Nobody.', 'Mornings arrive when they are invited.'] } },
    { from: 540, mode: { emoji: '🥱', label: 'Waking Up', anim: 'sway', accent: '#ffc24d', asleep: false,
      quips: ['Imethma Standard Time is officially a thing.', 'Wake-up time: varies. Always worth waiting for.', 'The day starts when Ime says it does.', 'Good morning, on Imethma Standard Time.'],
      warm:  ['Good morning! Whenever that happens to be. ☀️', 'Take it slow. The day will wait.'],
      mem:   ['Imethma Standard Time: always fashionably on time. Ish.', 'The morning shows up after you do.'] } },
    { from: 660, mode: { emoji: '🍞', label: 'Breakfast Time', anim: 'bounce', accent: '#ffc24d', asleep: false,
      quips: ['Toast: the loyal recipe.', 'Same toast, same joy.', 'Butter side up, please.', 'Breakfast, eventually.'],
      warm:  ['Toast loyalty: 100%. 🍞', 'Breakfast tastes better when someone wishes you good morning. Good morning!'],
      mem:   ['Toast has never let anyone down. Not once.', 'Some recipes are loyal for life.'] } },
    { from: 720, mode: { emoji: '📚', label: 'Study Time', anim: 'wobble', accent: '#4de3ff', asleep: false,
      quips: ['Notes: taken. Focus: loading.', 'Lecture in progress. Brain in progress.', 'Highlighter budget: unlimited.', 'Knowledge is being acquired.'],
      warm:  ['You are cleverer than any lecture slide. 💗', 'Proud of you for showing up.'],
      mem:   ['Notes are just doodles with a purpose.', 'Every lecture ends eventually.'] } },
    { from: 900, mode: { emoji: '🍽️', label: 'Linner Zone', anim: 'wobble', accent: '#ff9f5a', asleep: false,
      quips: ['Lunch, but make it late.', 'Too late for lunch, too early for dinner.', 'Linner is a lifestyle.', 'Yes, it counts as a meal.'],
      warm:  ['Linner, undefeated. Also: hi. 👋', 'Enjoy it. You have earned this linner.'],
      mem:   ['Linner: officially a real place now.', 'Somewhere a linner is being enjoyed with zero guilt.'] } },
    { from: 990, mode: { emoji: '💪', label: 'Gym Time', anim: 'pulse', accent: '#ff7a4d', asleep: false,
      quips: ['Bike, treadmill, a few exercises. Easy.', 'Sweat now, snacks later.', 'Gains loading…', 'Stronger with every rep.'],
      warm:  ['Look after yourself. You deserve it.', 'Proud of you for showing up.'],
      mem:   ['The treadmill has never won an argument.', 'Three exercises, five if feeling brave.'] } },
    { from: 1080, mode: { emoji: '🎮', label: 'Chill Mode', anim: 'shake', accent: '#c96bff', asleep: false,
      quips: ['Food first. Block Blast second. YouTube third.', 'One more round. Famous last words.', 'Autoplay is winning again.', 'High score to beat: yours.'],
      warm:  ['Blocks blasted, day nearly done. Well done.', 'Rest up. You have earned it.'],
      mem:   ['Block Blast: the game that eats evenings.', 'One video turned into ten.'] } },
    { from: 1200, mode: { emoji: '🏪', label: 'Evening Shop Shift', anim: 'hop', accent: '#3dffa2', asleep: false,
      quips: ['Evening shift: snacks, smiles, repeat.', 'Behind the counter, in charge of everything.', 'Customer count: rising.', 'Smile at the till: +10 points.'],
      warm:  ['A smile at the counter can make someone\'s whole day. 😊', 'Hang in there. The shift ends eventually.'],
      mem:   ['A smile at the till has probably fixed somebody\'s evening.', 'Every shift ends. Every single one.'] } },
    { from: 1380, mode: WIND }
  ];
  // minutes since midnight -> the block she is in
  function modeFor(minutes) {
    var m = MODES[0].mode;
    for (var i = 0; i < MODES.length; i++) if (minutes >= MODES[i].from) m = MODES[i].mode;
    return m;
  }
  var ACC2 = { '#c96bff': '#4de3ff', '#8b7bff': '#4d5bff', '#3dffa2': '#4de3ff', '#7fb2ff': '#b48bff', '#ffc24d': '#ff8f6b', '#4de3ff': '#3dffa2', '#ff9f5a': '#ff5a8a', '#ff7a4d': '#ffc24d' };
  var TAGLINES = ['Imethma Standard Time', 'Accurate to the nearest snack', 'Now with 100% more linner', 'Running on toast and good vibes', 'Tick tock, snack o\'clock'];
  var DIFF_QUIPS = ['sunrise reaches her second 🌅', 'a tiny bit of time travel ⏳', 'Dubai always knows the future first 🔮', 'both clocks are correct, promise ✅'];
  var TAP_MSGS = { 3: 'Ha, that tickles 😄', 7: 'You found the fun button 🎈', 15: 'Okay okay, we get it, you like confetti 🎊', 30: 'This is now officially a game 🏆', 60: 'Time for a snack break 🍞' };


  // ---- time helpers ----
  var partsFmt = {}, dateFmt = {};
  function parts(zone, now) {
    var f = partsFmt[zone] || (partsFmt[zone] = new Intl.DateTimeFormat('en-GB', {
      timeZone: zone, hourCycle: 'h23', hour: 'numeric', minute: '2-digit', second: '2-digit'
    }));
    var o = {};
    f.formatToParts(now).forEach(function (p) { o[p.type] = p.value; });
    return { h: +o.hour, m: o.minute, s: o.second };
  }
  function dateText(zone, now) {
    var f = dateFmt[zone] || (dateFmt[zone] = new Intl.DateTimeFormat('en-GB', {
      timeZone: zone, weekday: 'long', day: 'numeric', month: 'long'
    }));
    return f.format(now);
  }
  // offset of a zone from UTC in minutes, at this moment
  function offsetMin(zone, now) {
    var f = new Intl.DateTimeFormat('en-US', { timeZone: zone, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' });
    var o = {};
    f.formatToParts(now).forEach(function (p) { o[p.type] = +p.value; });
    var asUTC = Date.UTC(o.year, o.month - 1, o.day, o.hour, o.minute, o.second);
    return Math.round((asUTC - Math.floor(now.getTime() / 1000) * 1000) / 60000);
  }
  function paint(id, zone, now) {
    var el = document.getElementById(id), p = parts(zone, now);
    var h12 = p.h % 12 || 12, ampm = p.h < 12 ? 'am' : 'pm';
    el.querySelector('[data-role=time]').innerHTML =
      h12 + ':' + p.m + '<span class="sec">:' + p.s + '</span><span class="ampm">' + ampm + '</span>';
    el.querySelector('[data-role=date]').textContent = dateText(zone, now);
    el.setAttribute('aria-label', el.querySelector('.city').textContent + ' ' + h12 + ':' + p.m + ' ' + ampm);
    return p;
  }

  // ---- state and elements ----
  var root = document.documentElement;
  var emojiEl = document.getElementById('modeEmoji'), nowEl = document.getElementById('modeNow'), quipEl = document.getElementById('quip');
  var subEl = document.getElementById('sub'), diffEl = document.getElementById('diff'), tapsEl = document.getElementById('taps'), toastEl = document.getElementById('toast');
  var current = null, quipIdx = 0, tagIdx = 0, diffIdx = 0, diffBase = '', taps = 0, toastTimer;

  function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  function showQuip() {
    quipEl.textContent = current.quips[quipIdx % current.quips.length];
    replay(quipEl, 'swap');
  }
  function showDiff() { diffEl.textContent = diffBase + ' · ' + DIFF_QUIPS[diffIdx % DIFF_QUIPS.length]; }
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3600);
  }

  function setMode(mode, announce) {
    var first = !current;
    current = mode;
    quipIdx = Math.floor(Math.random() * mode.quips.length);
    emojiEl.textContent = mode.emoji;
    emojiEl.className = 'emoji ' + mode.anim;
    nowEl.textContent = mode.label;
    replay(nowEl, 'swap');
    root.style.setProperty('--accent', mode.accent);
    root.style.setProperty('--accent2', ACC2[mode.accent] || '#8b7bff');
    document.title = mode.emoji + ' ' + mode.label + ' · Linner Clock';
    showQuip();
    if (!first && announce) { toast('New mode unlocked: ' + mode.label + ' ' + mode.emoji); burst(); }
  }

  // ---- fun bits ----
  function burst() {
    if (reduce) return;
    var r = emojiEl.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var set = [current.emoji, '✨', '🎉', current.emoji, '⭐'];
    for (var i = 0; i < 18; i++) {
      var b = document.createElement('span'), ang = Math.random() * 6.28, dist = 90 + Math.random() * 150;
      b.className = 'bit';
      b.textContent = set[i % set.length];
      b.style.left = cx + 'px'; b.style.top = cy + 'px';
      b.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      b.style.setProperty('--dy', Math.sin(ang) * dist - 40 + 'px');
      b.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
      document.body.appendChild(b);
      setTimeout((function (n) { return function () { n.remove(); }; })(b), 1000);
    }
  }
  function spawnFloater() {
    if (document.hidden || !current) return;
    var f = document.createElement('span'), box = document.getElementById('floaters');
    f.className = 'floater';
    f.textContent = current.emoji;
    f.style.left = Math.random() * 96 + 'vw';
    f.style.fontSize = (1.2 + Math.random() * 2) + 'rem';
    f.style.animationDuration = (10 + Math.random() * 9) + 's';
    f.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
    box.appendChild(f);
    f.addEventListener('animationend', function () { f.remove(); });
  }

  emojiEl.addEventListener('click', function () {
    taps++;
    burst();
    tapsEl.textContent = TAP_MSGS[taps] || ('taps: ' + taps);
  });
  quipEl.addEventListener('click', function () { quipIdx++; showQuip(); });
  document.querySelectorAll('.flag').forEach(function (fl) {
    fl.addEventListener('click', function () { replay(fl, 'spin'); });
  });

  // ---- main tick ----
  function tick() {
    var now = new Date();
    paint('dubai', DUBAI, now);
    var pr = paint('preston', PRESTON, now);

    var mode = modeFor(pr.h * 60 + (+pr.m));
    if (mode !== current) setMode(mode, true);

    var diff = (offsetMin(DUBAI, now) - offsetMin(PRESTON, now)) / 60;
    // diff > 0 means Dubai is ahead, so Preston is behind
    diffBase = diff === 0 ? 'Same time on both sides'
      : 'Preston is ' + Math.abs(diff) + (Math.abs(diff) === 1 ? ' hour' : ' hours') + (diff > 0 ? ' behind' : ' ahead of') + ' Dubai';
    if (!diffEl.textContent) showDiff();
    else diffEl.textContent = diffBase + ' · ' + DIFF_QUIPS[diffIdx % DIFF_QUIPS.length];
  }

  tick();
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', tick);

  // rotate the lines every few seconds
  setInterval(function () {
    quipIdx++; showQuip();
    diffIdx++; showDiff();
    tagIdx++;
    subEl.classList.add('out');
    setTimeout(function () { subEl.textContent = TAGLINES[tagIdx % TAGLINES.length]; subEl.classList.remove('out'); }, 400);
  }, 8000);

  if (!reduce) { setInterval(spawnFloater, 2200); spawnFloater(); }
})();
</script>
</body>
</html>
